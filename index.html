    <div class="innercanvascontainer" style="overflow: hidden;width:1px;height:1px;position: absolute;top:0;left:0;"></div>
    <!-- canvas图层：
    0层：地图层
    1层 UNIt层
    2层 fog层
    3层 选择层 -->
    
    <script src="./app.js"></script>
   <script>
    window.cacheimgsrc = {};
     window.saveImgToBase64 = async (img)=>{
        let canvas =document.createElement('canvas');
        await new Promise((resolve)=>{
            setTimeout(()=>{
                resolve(true)
            },100)
          
        })
        let innercanvascontainer = document.querySelector('.innercanvascontainer')
        innercanvascontainer.appendChild(canvas)
          canvas.width = img.width;
          canvas.height = img.height;
          canvas.style.position = 'fixed';
          canvas.style.left = '10000px';
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const base64String = canvas.toDataURL('image/png');
          localforage.setItem(img.src,base64String)
            await new Promise((resolve)=>{
            setTimeout(()=>{
                resolve(true)
            },100)
          
        })
            innercanvascontainer.removeChild(canvas)
        
     }
